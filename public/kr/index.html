<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://drg2mhzb9zcts.cloudfront.net/wedding/favicon-1.png" />
  <title>다나 &amp; 제이콥 결혼합니다</title>
  <meta name="description" content="다나 & 제이콥 결혼합니다." />

  <!-- Open Graph (shown when this link is shared in KakaoTalk, iMessage, etc.) -->
  <meta property="og:title" content="다나 & 제이콥 결혼합니다" />
  <meta property="og:description" content="2026. 08. 28" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://dana.jaicob.com/kr" />
  <meta property="og:image" content="https://dana.jaicob.com/kr/kr-link-preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="800" />
  <meta property="og:image:alt" content="다나 & 제이콥" />
  <meta property="og:locale" content="ko_KR" />

  <!-- Twitter / iMessage -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="다나 & 제이콥 결혼합니다" />
  <meta name="twitter:description" content="2026. 08. 28" />
  <meta name="twitter:image" content="https://dana.jaicob.com/kr/kr-link-preview.jpg" />

  <!-- Send real visitors on to the Korean site. Crawlers don't run JS, so
       they only read the meta tags above and never follow this. -->
  <script>
    window.location.replace('/#/kr');
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #f0ecdf;
      color: #3E3326;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo',
                   'Malgun Gothic', sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
      padding: 1.5rem;
    }
    .names {
      font-size: 1.75rem;
      letter-spacing: 0.08em;
      color: #3E3326;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background-color: #2352b8;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50%      { opacity: 1;    transform: scale(1.1); }
    }
    a.fallback {
      color: #2352b8;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="names">다나 &amp; 제이콥</div>
    <div class="dot"></div>
    <!-- Fallback for the rare visitor with JavaScript disabled -->
    <noscript>
      <a class="fallback" href="/#/kr">청첩장 보기 →</a>
    </noscript>
  </div>
</body>
</html>
